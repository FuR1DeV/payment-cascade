[project]
name = "payment-cascade"
version = "0.1.0"
description = "Payment cascading across several PSPs: routing, decline handling, idempotency, webhooks, reconciliation."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.162,<1",
    "uvicorn[standard]>=0.54",
    "uvicorn-worker>=0.3",
    "gunicorn>=23",
    "sqlalchemy[asyncio]>=2.1,<2.2",
    "asyncpg>=0.30",
    "alembic>=1.16",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.9",
    "redis>=5.2",
    "taskiq>=0.13,<0.14",
    "taskiq-redis>=1.2,<2",
    "httpx>=0.28,<1",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3"
pytest-asyncio = ">=1.0"
ruff = ">=0.12"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC", "S", "PT"]
ignore = [
    "S311",  # random in the mock PSP is not used for crypto
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107"]
"scripts/**" = ["S101", "S310"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
